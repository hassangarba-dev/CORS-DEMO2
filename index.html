<script>
fetch('https://sitebuilder.xsolla.com/api/session', {
    method: 'POST',
    credentials: 'include',
    mode: 'cors'
})
.then(response => {
    // Try to read the response body as text
    return response.text();
})
.then(data => {
    // Show the response data in an alert popup
    alert('Response data: ' + data);
})
.catch(err => {
    // Show the error in an alert popup
    alert('Error: ' + err.message);
});
</script>
